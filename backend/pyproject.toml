[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panchayatcast-backend"
version = "0.1.0"
description = "FastAPI backend and dynamic ML inference service for SIH26074 weather downscaling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PanchayatCast Contributors" }
]

[tool.pytest.ini_options]
testpaths = ["../testing", "tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
