model_name: "cnn_unet"
model_version: "v1.0.0"
variable: "rainfall"
lead_time_hours: 24

architecture:
  in_channels: 4
  out_channels: 1
  base_channels: 32
  depth: 4
  use_batchnorm: true
  bilinear: true

training:
  batch_size: 8
  learning_rate: 0.0005
  max_epochs: 60
  loss_function: "mse_ssim"
  loss_weights:
    mse: 0.8
    ssim: 0.2
  device: "cuda"

data:
  input_raster_dir: "data/processed/grid_rasters/"
  target_resolution_m: 1000
