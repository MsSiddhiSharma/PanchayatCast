model_name: "xgboost"
model_version: "v1.0.0"
variable: "rainfall"
lead_time_hours: 24

training:
  objective: "reg:quantileerror"
  quantile_alpha: 0.50
  n_estimators: 400
  learning_rate: 0.03
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  early_stopping_rounds: 30

data:
  features_path: "data/features/panchayat_features_train.parquet"
  target_column: "observed_rainfall"
  split_strategy: "spatial_cluster_holdout"
